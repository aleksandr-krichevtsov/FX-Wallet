name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-java@v6.0.1
              with:
                  distribution: temurin
                  java-version: 25
            - uses: gradle/actions/setup-gradle@v6.4.0
            - run: ./gradlew ktlintCheck lint test assembleDebug
            - run: ./gradlew ktlintCheck detekt lint test assembleDebug
